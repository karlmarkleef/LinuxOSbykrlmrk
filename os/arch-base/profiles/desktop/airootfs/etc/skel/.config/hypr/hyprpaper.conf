# Mark Linux — hyprpaper configuration
# Docs: https://github.com/hyprwm/hyprpaper
#
# Sharp rendering tips:
#   - Dùng ảnh nguồn >= resolution màn hình (ví dụ: 1920x1080 cho FHD, 2560x1440 cho QHD)
#   - Tránh JPEG (nên dùng PNG hoặc WebP lossless)
#   - Hyprpaper tự scale đúng DPI, không dùng swaybg

# Preload wallpaper vào bộ nhớ trước khi hiển thị (tránh flash đen)
preload = /usr/share/marklinux/wallpapers/marklinux-aurora.png

# Per-monitor wallpaper
# Tên monitor lấy từ: hyprctl monitors
# Dấu phẩy đầu tiên = áp cho tất cả monitor nếu không chỉ định tên
wallpaper = ,/usr/share/marklinux/wallpapers/marklinux-aurora.png

# Ví dụ multi-monitor (bỏ comment nếu cần):
# wallpaper = DP-1,/usr/share/marklinux/wallpapers/marklinux-aurora.png
# wallpaper = HDMI-A-1,/usr/share/marklinux/wallpapers/marklinux-dark.png

# Tắt splash text (không hiện "Made with Hyprland")
splash = false

# Cho phép đổi wallpaper runtime qua: hyprctl hyprpaper wallpaper "eDP-1,/path/to/image.png"
ipc = on
